# The module registers itself; disable any other cache module (ehcache, caffeine)
# that is on the classpath to avoid duplicate bindings.
play.modules.enabled += "com.dipuce.cache.iron.IronCacheModule"

# Defaults for the Iron Cache module. Override in your application.conf.
iron {
  # Required: your Iron.io OAuth token and project id (from the Iron.io dashboard).
  # token      = "..."
  # project.id = "..."

  cache {
    host    = "https://cache-aws-us-east-1.iron.io"
    name    = "cache"
    # Request timeout, also used by the synchronous cache API when awaiting.
    timeout = 5 seconds
  }
}
