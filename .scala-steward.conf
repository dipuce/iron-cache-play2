# Scala Steward configuration — https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

# Keep Scala 3 on the LTS line; Play 3.0 is built against 3.3.x.
# Since Scala 3.8 the 3.x stdlib ships as scala-library, so pin the 2.13 line too.
# Play 3.0 publishes no sbt 2 plugin, so stay on sbt 1.x.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala-library",  version = "2.13." },
  { groupId = "org.scala-sbt",  artifactId = "sbt",            version = "1." }
]

# Group all Play artifacts into a single PR since they must move together.
pullRequests.grouping = [
  { name = "play", title = "Update Play Framework to ${nextVersion}", filter = [{ group = "org.playframework" }] }
]

updates.limit = 5
pullRequests.frequency = "@weekly"
commits.message = "Update ${artifactName} to ${nextVersion}"
