# Sample Play 3 application using the Iron Cache module.

play.http.secret.key = "changeme-this-is-only-a-sample"
play.http.secret.key = ${?APPLICATION_SECRET}

# Iron.io credentials — get these from the Iron.io dashboard, or export
# IRON_TOKEN / IRON_PROJECT_ID before running `sbt sample/run`.
iron {
  token      = "insert-token"
  token      = ${?IRON_TOKEN}
  project.id = "insert-project-ID"
  project.id = ${?IRON_PROJECT_ID}

  cache {
    name = "iron-test"
    # host    = "https://cache-aws-us-east-1.iron.io"
    # timeout = 5 seconds
  }
}
