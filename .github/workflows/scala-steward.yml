name: Scala Steward

# Opens pull requests for dependency, plugin and sbt updates. Dependabot does
# not understand sbt builds, so this replaces the alerts the old pom.xml had.
#
# The default GITHUB_TOKEN can open the PRs, but workflows do not run on PRs
# created with it, so CI will not check them. Add a STEWARD_TOKEN secret
# (a fine-grained PAT with contents + pull-requests write) to get CI on them.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v6
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
          author-email: "mike@dipuce.com"
          author-name: "Scala Steward"
