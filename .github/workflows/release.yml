name: Release

# Publishes to Maven Central through the Sonatype Central Portal with
# sbt-ci-release: a pushed tag whose name matches the version in build.sbt
# publishes a release; every push to master publishes a -SNAPSHOT.
#
# A tag can also be published on demand with "Run workflow" (workflow_dispatch),
# which is needed for tags created before this workflow existed: the tag's
# sources are checked out, sbt-ci-release is supplied as a global plugin in case
# the tag's build lacks it, and CI_COMMIT_TAG makes it treat the run as a tag push.
#
# Required organization/repository secrets (see README "Releasing"):
#   PGP_SECRET, PGP_PASSPHRASE, SONATYPE_USERNAME, SONATYPE_PASSWORD

on:
  push:
    branches: [master, main]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish as a release (e.g. 4.0.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - name: Provide sbt-ci-release for tags that predate it in project/plugins.sbt
        if: inputs.tag != ''
        run: |
          mkdir -p ~/.sbt/1.0/plugins
          echo 'addSbtPlugin("com.github.sbt" % "sbt-ci-release" % "1.12.1")' > ~/.sbt/1.0/plugins/ci-release.sbt
      - name: Publish
        # For dispatched tags the checked-out build may predate the isSnapshot
        # override in build.sbt, so pin it on the command line as well.
        run: |
          if [ -n "$CI_COMMIT_TAG" ]; then
            sbt -batch 'set ThisBuild / isSnapshot := false' 'set ThisBuild / dynverVTagPrefix := false' ci-release
          else
            sbt -batch ci-release
          fi
        env:
          CI_COMMIT_TAG: ${{ inputs.tag }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
